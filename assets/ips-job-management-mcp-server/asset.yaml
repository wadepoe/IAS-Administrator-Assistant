apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: ips-job-management-mcp-server
  description: Exposes SAP IPS Job Management REST API as MCP tools for triggering Read and Resync provisioning jobs and retrieving provisioning logs.
  version: "1.0.0"
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.json

provides:
  apis:
    - name: ips-job-management-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:ias-administrator-assistant-2cc77.ips-job-management-mcp-server:v1

requires:
  - name: ips-job-management-api
    kind: api
    ordId: customer.build:apiResource:ias-administrator-assistant-2cc77.ips-job-management-mcp-server:v1
